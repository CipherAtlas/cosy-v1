<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<div id="scene"></div><nav><button id="load">Load village</button><button id="residents">Check villager approaches</button><button id="approach">Watch Pip approach</button><button id="dialogue">Check villager dialogue</button><button id="meet-pip">Meet Pip</button><button id="meet-maple">Meet Maple</button><button id="meet-moss">Meet Moss</button><button id="meet-luma">Meet Luma</button><button id="portrait">Portrait / desktop</button><button id="capture">Capture entrance</button><button id="motion">Record movement</button><button id="profile">Profile 2 minutes</button><button id="cottage">Capture cottage</button><button id="bridgeSide">Bridge profile</button><button id="bridge">Capture bridge</button><button id="rain">Capture rain</button><button id="dusk">Capture dusk</button><button id="views">Capture all views</button><button id="hearth">Capture hearth</button><button id="up">Look up</button><button id="down">Look down</button><button id="rear">Rear valley</button><button id="signal">Verify audio output</button><button id="audit">Audit scene</button><button id="exits">Test activity exits</button><button id="lifecycle">Test audio lifecycle</button><button id="audio">Render music samples</button></nav><pre id="status">Ready.</pre><section id="samples"></section>
<script type="module">
import {VillageEngine} from './modules/features/village/VillageEngine.js';
import {VillageAudio} from './modules/features/village/audio.js';
import {Matrix4} from 'three';
import {checkDialogue} from './dialogue-tests.js';
import {checkResidents} from './resident-tests.js';
import {BRIDGE} from './modules/features/village/environment.js';
import {VillageMovement} from './modules/features/village/movement.js';
import {PLACES} from './modules/features/village/places.js';
import {VillageScore,SCORE_VERSION} from './modules/features/village/composition.js';
const status=document.querySelector('#status'),host=document.querySelector('#scene');
let engine, sound, stats, contacts=[], motion=[];
const delay=ms=>new Promise(r=>setTimeout(r,ms));
async function save(name,blob){const res=await fetch('/save/'+name,{method:'POST',body:blob});if(!res.ok)throw Error('Save failed '+name);}
const report=value=>status.textContent=typeof value==='string'?value:JSON.stringify(value,null,2);
window.addEventListener('error',e=>report('ERROR: '+e.message));window.addEventListener('unhandledrejection',e=>report('ERROR: '+e.reason));
document.querySelector('#load').onclick=async()=>{
 engine?.dispose();sound?.dispose();sound=new VillageAudio();
 engine=new VillageEngine(host,{progress:n=>report('Loading '+n+'%'),ready:()=>report('Loaded'),near:()=>{},interact:()=>{},error:report,stats:(fps,draws,triangles)=>{stats={fps,draws,triangles}},movement:s=>motion.push(s),contact:e=>{contacts.push(e);sound.contact(e)},environment:e=>sound.setEnvironment(e)});
 await engine.load();engine.setQuality('high');engine.setWeather('golden');report('Ready: engine loaded, high tier.');
};
document.querySelector('#residents').onclick=async()=>{
 try{const results=checkResidents();await save('villager-approach.json',JSON.stringify(results,null,2));report(results)}
 catch(error){report('FAIL: '+error.message);throw error}
};
document.querySelector('#approach').onclick=async()=>{
 if(!engine){report('Load the village first.');return}
 engine.setPlace(null);engine.setBlocked(false);
 const r=engine.life.residents[0];r.movement.settle(...r.route[0]);r.root.position.set(r.movement.position.x,r.movement.position.y,r.movement.position.z);
 r.pause=0;r.chatting=false;Object.assign(r.encounter,{state:'roam',path:[],noticed:false,cooldown:0,time:0,checkIn:0});
 engine.movement.settle(r.root.position.x+1,r.root.position.z+5.3);engine.player.position.set(engine.movement.position.x,engine.movement.position.y,engine.movement.position.z);engine.yaw=.15;engine.pitch=.15;engine.distance=5;
 engine.dialogue.bubbles[0].greetingSeen=false;
 const samples=[];
 for(let i=0;i<19;i++){
  samples.push({second:i,position:r.root.position.toArray(),distance:r.root.position.distanceTo(engine.player.position),state:r.encounter.state,gait:r.movement.gait,chatting:r.chatting,bubble:engine.dialogue.bubbles[0].element.hidden?null:engine.dialogue.bubbles[0].text.textContent});
  report({watching:'Pip approaches, greets you, then returns',latest:samples.at(-1)});
  if(i<18)await delay(1000);
 }
 const result={pass:samples.some(s=>s.state==='approach'&&s.gait==='walk')&&samples.some(s=>s.state==='visit'&&s.bubble)&&samples.some(s=>s.state==='return')&&Math.min(...samples.filter(s=>['approach','visit'].includes(s.state)).map(s=>s.distance))>2,samples};
 await save('villager-approach-runtime.json',JSON.stringify(result,null,2));report(result);

};
document.querySelector('#dialogue').onclick=async()=>{
 try{const results=await checkDialogue(engine,host);await save('villager-dialogue.json',JSON.stringify(results,null,2));report(results)}
 catch(error){report('FAIL: '+error.message);throw error}
};
for(const [i,id] of ['pip','maple','moss','luma'].entries())document.querySelector('#meet-'+id).onclick=()=>{
 if(!engine){report('Load the village first.');return}
 engine.setPlace(null);engine.setBlocked(false);engine.setLanguage('en');engine.setWeather('golden');
 const resident=engine.life.residents[i];resident.movement.settle(...resident.route[0]);resident.root.position.set(resident.movement.position.x,resident.movement.position.y,resident.movement.position.z);resident.pause=120;

document.querySelector('#portrait').onclick=()=>{const portrait=host.clientWidth>700;host.style.width=portrait?'390px':'1280px';host.style.height=portrait?'844px':'720px';report(portrait?'390 x 844 layout':'1280 x 720 layout')};
async function capture(name,camera=engine.camera){engine.renderer.render(engine.scene,camera);await new Promise(resolve=>engine.renderer.domElement.toBlob(async b=>{await save(name,b);resolve()},'image/png'));report('Saved '+name);}
document.querySelector('#capture').onclick=async()=>{engine.setPlace(null);engine.setWeather('golden');engine.movement.settle(.3,20);engine.yaw=0;engine.pitch=.15;await delay(1600);await capture('entrance.png')};
for(const weather of ['rain','dusk'])document.querySelector('#'+weather).onclick=async()=>{engine.setPlace(null);engine.setWeather(weather);await delay(1200);await capture(weather+'.png')};
document.querySelector('#cottage').onclick=async()=>{engine.travel('focus');await delay(1200);await capture('cottage.png')};
document.querySelector('#bridge').onclick=async()=>{engine.setPlace(null);engine.movement.settle(-7,3);engine.pitch=.15;engine.yaw=1.3;await delay(1600);await capture('bridge.png')};
for(const [id,pitch,yaw] of [['up',-.85,0],['down',1.35,0],['rear',.08,Math.PI]])document.querySelector('#'+id).onclick=async()=>{engine.setPlace(null);engine.movement.settle(.3,20);engine.pitch=pitch;engine.yaw=yaw;await delay(1600);await capture('camera-'+id+'.png')};
document.querySelector('#hearth').onclick=async()=>{engine.setPlace(null);engine.setWeather('golden');engine.movement.settle(-2,-13.5);engine.pitch=.25;engine.yaw=.6;await delay(1600);await capture('hearth.png')};
document.querySelector('#views').onclick=async()=>{for(const id of ['capture','cottage','bridge','rain','dusk','hearth','up','down','rear','bridgeSide'])await document.querySelector('#'+id).onclick();report('All ten views saved.')};
document.querySelector('#signal').onclick=async()=>{
 const a=new VillageAudio();a.setMix({music:.6,rain:.1,fire:.35,master:.65,vibe:'piano',ambience:.5,effects:.6});
 try{
  const result=await a.start();a.setEnvironment({listener:[-5,1.4,-19],forward:[0,0,-1],wind:.5,weather:'golden',sheltered:false});
  const analyser=a.context.createAnalyser();analyser.fftSize=2048;a.master.connect(analyser);const data=new Float32Array(analyser.fftSize);let peak=0,sum=0,count=0;
  for(let i=0;i<35;i++){await delay(100);analyser.getFloatTimeDomainData(data);for(const sample of data){peak=Math.max(peak,Math.abs(sample));sum+=sample*sample;count++}}
  const output={browser:navigator.userAgent,context:a.context.state,sampled:result.sampled,listenerAPI:a.context.listener.positionX?'AudioParam':'legacy methods',peak,rms:Math.sqrt(sum/count),pass:peak>.0001&&a.context.state==='running'};
  await save('audio-output.json',JSON.stringify(output,null,2));report(output);a.master.disconnect(analyser);
 }finally{a.dispose()}
};
document.querySelector('#exits').onclick=async()=>{
 if(!engine){report('Load the village first.');return}
 const results=[];
 const directions=[[1,0],[-1,0],[0,1],[0,-1]];
 const walkFrom=(x,z,dx,dz)=>{
  const movement=new VillageMovement(engine.world.colliders,()=>{});movement.settle(x,z);
  for(let i=0;i<30;i++)movement.update(1/120,{x:dx,z:dz,run:false,sprint:false,blocked:false});
  return Math.hypot(movement.position.x-x,movement.position.z-z);
 };
 try{
  for(const [x,z] of [[-20,-8],[-20,8]]){
   if(directions.some(([dx,dz])=>walkFrom(x,z,dx,dz)>.01))throw Error('Old trapped arrival no longer reproduces: '+[x,z]);
  }
  for(const place of PLACES){
   engine.travel(place.id);engine.keys.add('w');engine.movement.jump();engine.setPlace(null);
   const {x,z}=engine.movement.position;
   const distances=directions.map(([dx,dz])=>walkFrom(x,z,dx,dz));
   if(distances.some(d=>d<.2))throw Error(place.id+' blocks walking after exit: '+distances);
   if(engine.place!==null||!engine.player.visible||engine.keys.size||!engine.movement.grounded||engine.movement.velocity.y!==0)throw Error(place.id+' did not restore exploration');
   const cameraDistance=engine.camera.position.distanceTo(engine.currentLook);
   if(cameraDistance<1.5||engine.camera.position.distanceTo(engine.cameraGoal)>.001)throw Error(place.id+' did not restore the walking camera');
   results.push({place:place.id,arrival:[x,z],walkDistances:distances,cameraDistance});
  }
  engine.travel('breathe');engine.setPlace(null);
  const reportData={pass:true,oldPondAndNookTrapReproduced:true,results};
  report(reportData);await save('activity-exits.json',JSON.stringify(reportData,null,2));
 }catch(error){report('FAIL: '+error.message);throw error}
};
document.querySelector('#audit').onclick=async()=>{
 const start=engine.life.residents.map(r=>r.root.position.clone());await delay(5000);
 const lane=new VillageMovement(engine.world.colliders,()=>{});lane.settle(-1.5,-9);for(let i=0;i<600;i++)lane.update(1/60,{x:0,z:-1,run:false,sprint:false,blocked:false});
 let blockedPlanting=0;const matrix=new Matrix4();for(const mesh of engine.world.vegetation)for(let i=0;i<mesh.count;i++){mesh.getMatrixAt(i,matrix);const x=matrix.elements[12],z=matrix.elements[14];if(Math.abs(x-BRIDGE.x)<BRIDGE.length/2+1&&Math.abs(z-BRIDGE.z)<BRIDGE.width/2+.65)blockedPlanting++}
 const reportData={bridgePlantingClear:blockedPlanting===0,mainPathClear:lane.position.z < -28,residents:engine.life.residents.length,residentsMoving:engine.life.residents.filter((r,i)=>r.root.position.distanceTo(start[i])>.15).length,birds:engine.life.bodies.count,sky:engine.atmosphere.sky.visible,stats,colliders:engine.world.colliders.length};
 report(reportData);await save('scene-audit.json',JSON.stringify(reportData,null,2));
};
document.querySelector('#bridgeSide').onclick=async()=>{engine.setPlace(null);engine.setWeather('golden');engine.movement.settle(-10.534,3);engine.pitch=.15;await delay(1600);const camera=engine.camera.clone();camera.position.set(-8,2.4,13);camera.lookAt(-10.5,.5,3);await capture('bridge-side.png',camera)};
async function walk(key,seconds){engine.walkKey(key,true);await delay(seconds*1000);engine.walkKey(key,false)}
document.querySelector('#motion').onclick=async()=>{
 engine.setPlace(null);engine.setWeather('golden');engine.movement.settle(.3,20);engine.yaw=0;engine.pitch=.15;contacts=[];motion=[];await sound.start();
 const chunks=[],stream=engine.renderer.domElement.captureStream(30),audioCapture=sound.context.createMediaStreamDestination();sound.master.connect(audioCapture);stream.addTrack(audioCapture.stream.getAudioTracks()[0]);const recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9,opus',videoBitsPerSecond:2500000});
 const recording=new Promise(resolve=>{recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>resolve(new Blob(chunks,{type:'video/webm'}))});recorder.start();
 await walk('w',2);engine.toggleRun();await walk('w',2);engine.walkKey('shift',true);await walk('w',3);engine.walkKey('shift',false);
 engine.walkKey(' ',true);engine.walkKey(' ',false);await walk('w',1.1);await delay(500);
 engine.movement.settle(BRIDGE.x+BRIDGE.length/2+.8,BRIDGE.z);engine.yaw=0;await walk('a',3.3);await delay(400);await walk('d',3.3);engine.walkKey(' ',true);engine.walkKey(' ',false);await delay(1200);
 recorder.stop();stream.getTracks().forEach(t=>t.stop());sound.master.disconnect(audioCapture);sound.stop();await save('motion.webm',await recording);
 report({recording:'motion.webm (canvas and master-bus audio before the output compressor)',gaits:[...new Set(motion.map(s=>s.gait))],contacts:contacts.reduce((a,e)=>(a[e.kind]=(a[e.kind]||0)+1,a),{}),energy:Math.min(...motion.map(s=>s.stamina)),stats});
};
document.querySelector('#profile').onclick=async()=>{
 engine.setPlace(null);engine.setWeather('golden');engine.movement.settle(.3,20);engine.yaw=0;engine.pitch=.15;if(engine.running)engine.toggleRun();
 const times=[],start=performance.now();let last=start,record=true,frame;const sample=now=>{times.push(now-last);last=now;if(record)frame=requestAnimationFrame(sample)};frame=requestAnimationFrame(sample);
 for(let loop=0;loop<6;loop++){report('Profiling traversal '+(loop+1)+'/6');await walk('w',8);await walk('s',8);engine.walkKey(' ',true);engine.walkKey(' ',false);await delay(4000);}
 record=false;cancelAnimationFrame(frame);times.sort((a,b)=>a-b);
 const reportData={date:new Date().toISOString(),durationSeconds:(performance.now()-start)/1000,viewport:[innerWidth,innerHeight],canvas:[host.clientWidth,host.clientHeight],buffer:[engine.renderer.domElement.width,engine.renderer.domElement.height],dpr:devicePixelRatio,tier:'high',frames:times.length,meanMs:times.reduce((a,b)=>a+b,0)/times.length,p95Ms:times[Math.floor(times.length*.95)],stats,rendererMemory:engine.renderer.info.memory,limits:'In-app browser, local desktop, no physical phone or thermal profiling. JS geometry counts are not GPU residency.'};
 await save('profile.json',JSON.stringify(reportData,null,2));report(reportData);
};
document.querySelector('#lifecycle').onclick=async()=>{
 const results=[];const check=(name,condition)=>{if(!condition)throw Error(name);results.push(name)};
 const a=new VillageAudio();a.setMix({music:.6,rain:0,fire:0,master:0,vibe:'piano',ambience:0,effects:0});
 try {
  const ready=await a.start();check('All 14 piano samples decoded',ready.sampled&&a.piano.size===14);
  check('Starting at master zero suspends the graph',a.context.state==='suspended');
  a.setMix({music:0,rain:0,fire:0,master:.1,vibe:'piano',ambience:0,effects:0});for(let retry=0;retry<20&&a.context.state!=='running';retry++)await delay(100);check('Unmute resumes the graph ('+a.context.state+')',a.context.state==='running');
  for(let i=0;i<40;i++)a.contact({kind:'footstep',position:[0,0,20],surface:'stone',speed:4,impact:0,foot:'left'});
  check('Transient voices capped at 16',a.voices.size<=16);
  a.setPlace('focus');a.setPlace(null);check('Leaving focus resets simple-view shelter',!a.environment.sheltered&&a.environment.listener[0]<100);
  let legacyPosition=false,legacyOrientation=false;const listener=a.context.listener;
  Object.defineProperty(listener,'positionX',{value:undefined,configurable:true});
  const oldPosition=listener.setPosition.bind(listener),oldOrientation=listener.setOrientation.bind(listener);
  listener.setPosition=(...v)=>{legacyPosition=true;oldPosition(...v)};listener.setOrientation=(...v)=>{legacyOrientation=true;oldOrientation(...v)};
  a.setEnvironment({listener:[1,2,3],forward:[0,0,-1],sheltered:false,wind:.4,weather:'golden'});
  check('Legacy Firefox listener path updates position and orientation',legacyPosition&&legacyOrientation);
  delete listener.positionX;listener.setPosition=oldPosition;listener.setOrientation=oldOrientation;
  a.nextBar=a.context.currentTime-10;a.queue=[{time:0,event:{instrument:'piano',midi:60,beat:0,duration:1,velocity:.1},duration:1,vibe:'piano'}];a.schedule();
  check('Overdue queue discarded',a.queue.every(e=>e.time>=a.context.currentTime-.05));
  a.stop();await delay(450);check('Stop suspends context and clears voices',a.context.state==='suspended'&&a.voices.size===0);a.dispose();
  const originalFetch=window.fetch;window.fetch=(url,options)=>String(url).includes('/village/audio/')?Promise.resolve(new Response('',{status:503})):originalFetch(url,options);
  const fallback=new VillageAudio();fallback.setMix({music:0,rain:0,fire:0,master:0,vibe:'piano'});
  try{const result=await fallback.start();check('Sample failure is reported',!result.sampled&&fallback.piano.size===0)}finally{window.fetch=originalFetch;fallback.dispose()}
  report(results);await save('audio-lifecycle.json',JSON.stringify(results,null,2));
 }finally{a.dispose()}
};
function wav(buffer){const samples=buffer.length,channels=buffer.numberOfChannels,data=new ArrayBuffer(44+samples*channels*2),v=new DataView(data);const str=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));str(0,'RIFF');v.setUint32(4,data.byteLength-8,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,channels,true);v.setUint32(24,buffer.sampleRate,true);v.setUint32(28,buffer.sampleRate*channels*2,true);v.setUint16(32,channels*2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,samples*channels*2,true);let peak=0,sum=0;const arrays=Array.from({length:channels},(_,i)=>buffer.getChannelData(i));for(let i=0;i<samples;i++)for(let ch=0;ch<channels;ch++){const a=arrays[ch][i];peak=Math.max(peak,Math.abs(a));sum+=a*a;v.setInt16(44+(i*channels+ch)*2,Math.round(Math.max(-1,Math.min(1,a))*32767),true)}return{blob:new Blob([data],{type:'audio/wav'}),peakDb:20*Math.log10(peak),rmsDb:10*Math.log10(sum/(samples*channels))};}
document.querySelector('#audio').onclick=async()=>{
 const original=window.AudioContext,measurements=[];engine?.setBlocked(true);
 try{for(const [i,vibe] of ['piano','lofi','jazz'].entries()){
  report('Rendering '+vibe+' (120 seconds)');
  const offline=new OfflineAudioContext(2,22050*125,22050);window.AudioContext=function(){return offline};
  const audio=new VillageAudio();audio.graph();window.AudioContext=original;
  await Promise.all([['A1',33],['C2',36],['Ds2',39],['Fs2',42],['A2',45],['C3',48],['Ds3',51],['Fs3',54],['A3',57],['C4',60],['Ds4',63],['Fs4',66],['A4',69],['C5',72]].map(async([name,midi])=>audio.piano.set(midi,await offline.decodeAudioData(await(await fetch('/village/audio/'+name+'.mp3')).arrayBuffer()))));
  audio.master.gain.value=.65*.65;audio.music.gain.value=.6;audio.ambience.gain.value=0;audio.effects.gain.value=0;
  const seed=62025+i*17,score=new VillageScore(seed);let time=.1,maxVoices=0,bars=0;
  while(time<120){const plan=score.next(vibe),beat=60/plan.tempo;bars++;for(const event of plan.events){const when=time+event.beat*beat;if(when>120)continue;for(const v of audio.voices)if(v.end<when)audio.voices.delete(v);if(event.instrument==='piano'||event.instrument==='bass')audio.tone(event,when,event.duration*beat,vibe);else audio.percussion(event,when,event.duration*beat);maxVoices=Math.max(maxVoices,audio.voices.size)}time+=beat*4;}
  const buffer=await offline.startRendering(),result=wav(buffer);await save('audio-'+vibe+'.wav',result.blob);
  measurements.push({vibe,seed,scoreVersion:SCORE_VERSION,bars,maxVoices,peakDb:result.peakDb,rmsDb:result.rmsDb,seconds:125,music:.6,master:.65,method:'Offline rendering of production instruments and score; includes 5 seconds tail. Not a live traversal or listening certification.'});
  const element=document.createElement('audio');element.controls=true;element.src=URL.createObjectURL(result.blob);element.setAttribute('aria-label',vibe+' sample');document.querySelector('#samples').append(element);document.removeEventListener('visibilitychange',audio.onVisibility);
 }await save('audio-measurements.json',JSON.stringify(measurements,null,2));report(measurements)}finally{window.AudioContext=original;engine?.setBlocked(false)}
};
