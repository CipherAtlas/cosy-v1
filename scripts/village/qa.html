document.querySelector('#signal').onclick=async()=>{
 const a=new VillageAudio();a.setMix({music:.6,rain:.1,fire:.35,master:.65,vibe:'piano',ambience:.5,effects:.6});
 try{
  const result=await a.start();a.setEnvironment({listener:[-5,1.4,-19],forward:[0,0,-1],wind:.5,weather:'golden',sheltered:false});
  const analyser=a.context.createAnalyser();analyser.fftSize=2048;a.master.connect(analyser);const data=new Float32Array(analyser.fftSize);let peak=0,sum=0,count=0;
  for(let i=0;i<35;i++){await delay(100);analyser.getFloatTimeDomainData(data);for(const sample of data){peak=Math.max(peak,Math.abs(sample));sum+=sample*sample;count++}}

document.querySelector('#exits').onclick=async()=>{
 if(!engine){report('Load the village first.');return}
 const results=[];
 const directions=[[1,0],[-1,0],[0,1],[0,-1]];
 const walkFrom=(x,z,dx,dz)=>{
  const movement=new VillageMovement(engine.world.colliders,()=>{});movement.settle(x,z);
  for(let i=0;i<30;i++)movement.update(1/120,{x:dx,z:dz,run:false,sprint:false,blocked:false});
  return Math.hypot(movement.position.x-x,movement.position.z-z);
 };
 try{
  for(const [x,z] of [[-20,-8],[-20,8]]){
   if(directions.some(([dx,dz])=>walkFrom(x,z,dx,dz)>.01))throw Error('Old trapped arrival no longer reproduces: '+[x,z]);
  }
  for(const place of PLACES){
   engine.travel(place.id);engine.keys.add('w');engine.movement.jump();engine.setPlace(null);
   const {x,z}=engine.movement.position;
   const distances=directions.map(([dx,dz])=>walkFrom(x,z,dx,dz));
   if(distances.some(d=>d<.2))throw Error(place.id+' blocks walking after exit: '+distances);
   if(engine.place!==null||!engine.player.visible||engine.keys.size||!engine.movement.grounded||engine.movement.velocity.y!==0)throw Error(place.id+' did not restore exploration');
   const cameraDistance=engine.camera.position.distanceTo(engine.currentLook);
   if(cameraDistance<3.79||engine.camera.position.distanceTo(engine.cameraGoal)>.001)throw Error(place.id+' did not restore the walking camera');
   results.push({place:place.id,arrival:[x,z],walkDistances:distances,cameraDistance});
  }
  engine.travel('breathe');engine.setPlace(null);
  const reportData={pass:true,oldPondAndNookTrapReproduced:true,results};
  report(reportData);await save('activity-exits.json',JSON.stringify(reportData,null,2));
 }catch(error){report('FAIL: '+error.message);throw error}
};
document.querySelector('#audit').onclick=async()=>{
 const start=engine.life.residents.map(r=>r.root.position.clone());await delay(5000);
 const lane=new VillageMovement(engine.world.colliders,()=>{});lane.settle(-1.5,-9);for(let i=0;i<600;i++)lane.update(1/60,{x:0,z:-1,run:false,sprint:false,blocked:false});
 let blockedPlanting=0;const matrix=new Matrix4();for(const mesh of engine.world.vegetation)for(let i=0;i<mesh.count;i++){mesh.getMatrixAt(i,matrix);const x=matrix.elements[12],z=matrix.elements[14];if(Math.abs(x-BRIDGE.x)<BRIDGE.length/2+1&&Math.abs(z-BRIDGE.z)<BRIDGE.width/2+.65)blockedPlanting++}
 const reportData={bridgePlantingClear:blockedPlanting===0,mainPathClear:lane.position.z < -28,residents:engine.life.residents.length,residentsMoving:engine.life.residents.filter((r,i)=>r.root.position.distanceTo(start[i])>.15).length,birds:engine.life.bodies.count,sky:engine.atmosphere.sky.visible,stats,colliders:engine.world.colliders.length};
 report(reportData);await save('scene-audit.json',JSON.stringify(reportData,null,2));
};

document.querySelector('#motion').onclick=async()=>{
 engine.setPlace(null);engine.setBlocked(false);engine.setWeather('golden');engine.movement.settle(.3,20);engine.yaw=0;engine.pitch=.15;if(engine.running)engine.toggleRun();contacts=[];motion=[];await sound.start();
 const chunks=[],stream=engine.renderer.domElement.captureStream(30),audioCapture=sound.context.createMediaStreamDestination();sound.master.connect(audioCapture);stream.addTrack(audioCapture.stream.getAudioTracks()[0]);const recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9,opus',videoBitsPerSecond:2500000});
 const recording=new Promise(resolve=>{recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>resolve(new Blob(chunks,{type:'video/webm'}))});recorder.start();
 await walk('w',2);engine.toggleRun();await walk('w',2);engine.walkKey('shift',true);await walk('w',3);engine.walkKey('shift',false);
 engine.walkKey(' ',true);engine.walkKey(' ',false);await walk('w',1.1);await delay(500);

 recorder.stop();stream.getTracks().forEach(t=>t.stop());sound.master.disconnect(audioCapture);sound.stop();await save('motion.webm',await recording);
 const gaits=[...new Set(motion.map(s=>s.gait))],energy=Math.min(...motion.map(s=>s.stamina));
 const result={pass:['walk','run','sprint'].every(gait=>gaits.includes(gait))&&energy<100&&!contacts.some(event=>event.kind==='footstep'),recording:'motion.webm (canvas and master-bus audio before the output compressor)',gaits,contacts:contacts.reduce((a,e)=>(a[e.kind]=(a[e.kind]||0)+1,a),{}),energy,stats};
 await save('movement-checks.json',JSON.stringify(result,null,2));report(result);
};

 engine.setPlace(null);engine.setWeather('golden');engine.movement.settle(.3,20);engine.yaw=0;engine.pitch=.15;if(engine.running)engine.toggleRun();

 await save('profile.json',JSON.stringify(reportData,null,2));report(reportData);
};
document.querySelector('#lifecycle').onclick=async()=>{
 const originalRestFile=RECORDINGS.rest.file;const results=[],issues=[];const check=(name,condition)=>{if(!condition)throw Error(name);results.push(name);report(results)};
 const wait=async(test,label)=>{for(let i=0;i<150&&!test();i++)await delay(100);check(label,test())};
 const a=new VillageAudio(kind=>issues.push(kind));const mix={music:.6,rain:.12,fire:.35,master:.65,vibe:'piano',soundtrack:'auto',ambience:.5,effects:.6};
 try{
  a.setMix({...mix,master:0});const ready=await a.start();
  check('Three recorded nature beds decoded',ready.ambience&&a.recordings.size===3);
  check('Master zero starts suspended without fetching music',a.context.state==='suspended'&&a.soundtrack.decks.every(d=>!d.audio.src));
  a.setMix(mix);await wait(()=>a.context.state==='running'&&a.soundtrack.current==='village','Unmute starts the village recording');
  await delay(1500);check('Music playback advances',a.soundtrack.decks[a.soundtrack.active].audio.currentTime>.5);
  const analyser=a.context.createAnalyser();a.master.connect(analyser);analyser.fftSize=2048;const samples=new Float32Array(2048);let peak=0;
  for(let i=0;i<20;i++){analyser.getFloatTimeDomainData(samples);peak=Math.max(peak,...samples.map(Math.abs));await delay(100)}
  check('Recorded mix produces a non-silent signal',peak>.0001);a.master.disconnect(analyser);
  for(const [place,cue] of [['breathe','water'],['music','hearth'],['focus','rest']]){
   a.setPlace(place);await wait(()=>a.soundtrack.current===cue,place+' selects '+cue);
   check('Crossfade has at most two streaming decks',a.soundtrack.decks.filter(d=>!d.audio.paused).length<=2);
   await delay(4400);check('Old deck stops after '+place+' fade',a.soundtrack.decks.filter(d=>!d.audio.paused).length===1);
  }
  a.setMix({...mix,soundtrack:'village'});await wait(()=>a.soundtrack.current==='village','Manual soundtrack overrides the cottage cue');await delay(4500);
  const original=RECORDINGS.rest.file;RECORDINGS.rest.file='missing-test-track.mp3';a.setMix({...mix,soundtrack:'rest'});
  await wait(()=>issues.includes('music'),'Missing music reports an error');
  check('Failed change keeps the previous recording playing',a.soundtrack.current==='village'&&!a.soundtrack.decks[a.soundtrack.active].audio.paused);RECORDINGS.rest.file=original;
  a.setMix({...mix,soundtrack:'village',music:0});check('Music slider zero pauses media',a.soundtrack.decks.every(d=>d.audio.paused));
  a.setMix({...mix,soundtrack:'village'});await wait(()=>a.soundtrack.decks.some(d=>!d.audio.paused),'Music slider restores recorded playback');
  a.setMix({...mix,master:0});await wait(()=>a.context.state==='suspended','Master zero suspends all sound');
  check('Master zero pauses both music decks',a.soundtrack.decks.every(d=>d.audio.paused));
  a.setMix({...mix,music:0});await wait(()=>a.context.state==='running','World-only unmute resumes the context');
  a.setPlace('focus');a.setPlace(null);check('Leaving a place restores the outdoor listener',!a.environment.sheltered&&a.environment.listener[0]<100);
  for(let i=0;i<40;i++)a.contact({kind:'takeoff',position:[0,0,20],surface:'stone',speed:4,impact:0,foot:'left'});
  check('Transient effects remain capped at sixteen',[...a.voices].filter(v=>v.effect).length<=16);
  a.stop();await delay(450);check('Stop clears voices, pauses streams and suspends',a.voices.size===0&&a.context.state==='suspended'&&a.soundtrack.decks.every(d=>d.audio.paused));
  const frame={listener:[0,1.4,20],forward:[0,0,-1],wind:.3,weather:'dusk',sheltered:false};
  check('Dusk selects the quiet recording',soundtrackFor(mix,null,frame)==='rest');
  check('Rain selects the quiet recording',soundtrackFor(mix,null,{...frame,weather:'rain'})==='rest');
  const fetchOriginal=window.fetch;window.fetch=(url,options)=>String(url).includes('/audio/world/')?Promise.resolve(new Response('',{status:503})):fetchOriginal(url,options);
  const missing=new VillageAudio();missing.setMix({...mix,master:0});
  try{const r=await missing.start();check('Missing nature recordings report partial availability',!r.ambience)}finally{window.fetch=fetchOriginal;missing.dispose()}
  const result={pass:true,checks:results.length,results,peak,expectedMusicFailures:issues.length,browser:navigator.userAgent};
  await save('audio-lifecycle.json',JSON.stringify(result,null,2));report(result);
 }finally{RECORDINGS.rest.file=originalRestFile;a.dispose()}
};
document.querySelector('#audio').onclick=async()=>{
 const a=new VillageAudio(),chunks=[];await a.start();
 const destination=a.context.createMediaStreamDestination();a.master.connect(destination);
 const recorder=new MediaRecorder(destination.stream,{mimeType:'audio/webm;codecs=opus'});
 const recording=new Promise(resolve=>{recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>resolve(new Blob(chunks,{type:'audio/webm'}))});recorder.start();
 try{for(const place of [null,'breathe','music','focus']){a.setPlace(place);report('Recording '+(place??'village')+' soundscape');await delay(14000)}}
 finally{recorder.stop();await save('soundscape.webm',await recording);a.master.disconnect(destination);a.dispose()}
 report('Saved 56-second recorded soundtrack transition sample.');
};
document.querySelector('#polish').onclick=async()=>{
 if(!engine)return report('Load the village first.');
 engine.setPlace(null);engine.setBlocked(false);engine.setWeather('golden');engine.movement.settle(.3,20);engine.yaw=0;engine.pitch=.15;engine.distance=3.8;engine.player.rotation.y=Math.PI;
 await delay(1500);await capture('entrance.png');
 await walk('w',.6);await delay(350);const heading=engine.player.rotation.y;engine.yaw+=.8;await delay(2600);
 if(Math.abs(engine.player.rotation.y-heading)>.001)throw Error('Player turns toward camera while idle');
 const navigation=engine.world.group.getObjectByName('Village wayfinding');
 for(const [name,position,look] of [['arrival-directory',[-1.8,2.45,19.5],[-2.8,2.1,16]],['junction-post',[3.2,2.1,10],[3.15,1.8,5.2]],['cottage-post',[3,2.2,18],[4,1.7,14.4]],['soft-shadows',[0,2.7,16],[4,0,7]]]){
  const camera=engine.camera.clone();camera.position.set(...position);camera.lookAt(...look);await capture(name+'.png',camera);
 }
 engine.setLanguage('ja');const camera=engine.camera.clone();camera.position.set(-1.8,2.45,19.5);camera.lookAt(-2.8,2.1,16);await capture('arrival-directory-ja.png',camera);engine.setLanguage('en');
 const result={pass:true,playerHeadingRetained:true,posts:navigation.children.filter(object=>object.userData.signpost).length,shadowFilter:'16-tap weighted PCF',highQualityShadowRefresh:'every frame',errors:consoleErrors,stats};
 await save('polish-checks.json',JSON.stringify(result,null,2));report(result);
};

const activityMoment=id=>id==='focus'?{kind:'focus',running:true,progress:.35}:id==='music'?{kind:'music',playing:true}:id==='breathe'?{kind:'breathe',active:true,amount:.8}:{kind:({mood:'tea',gratitude:'write',compliment:'letter'})[id]};
document.querySelector('#living').onclick=async()=>{
 if(!engine)return report('Load the village first.');
 consoleErrors=[];const results=[];engine.setWeather('golden');engine.setBlocked(false);
 for(const id of ['focus','music','breathe','mood','gratitude','compliment']){
  engine.travel(id);engine.setActivityMoment(activityMoment(id));await delay(1400);
  const expected=ACTIVITY_STAGES[id].actor,actual=engine.player.position.toArray();
  if(!engine.player.visible||actual.some((v,i)=>Math.abs(v-expected[i])>.01))throw Error(id+' spirit staging failed');
  if(!engine.camera.view?.enabled)throw Error(id+' scene does not make room for controls');
  await capture('activity-'+id+'.png');results.push({id,actor:actual,visible:true});
 }
 for(const [name,position,look] of [['water-detail',[-5,2.5,13],[-11,-.3,1]],['fire-detail',[-3.8,1.65,-16.7],[-5.8,.8,-19]]]){
  engine.setPlace(null);await delay(400);const camera=engine.camera.clone();camera.position.set(...position);camera.lookAt(...look);await capture(name+'.png',camera);
 }
 engine.travel('breathe');engine.reducedMotion=true;await delay(300);const before=engine.character.position.clone();await delay(300);
 if(engine.character.position.distanceTo(before)>.001)throw Error('Reduced motion still moves the staged spirit');
 engine.reducedMotion=false;engine.setPlace(null);
 if(engine.camera.view?.enabled)throw Error('Activity framing persisted after exit');
 const result={pass:consoleErrors.length===0,activities:results,reducedMotion:true,exitFramingRestored:true,errors:consoleErrors,stats};
 await save('living-checks.json',JSON.stringify(result,null,2));report(result);
};
document.querySelector('#rituals').onclick=async()=>{
 const chunks=[],stream=engine.renderer.domElement.captureStream(30);
 const recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:2000000});
 const recording=new Promise(resolve=>{recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>resolve(new Blob(chunks,{type:'video/webm'}))});recorder.start();
 for(const id of ['music','breathe','focus','mood','gratitude','compliment']){
  engine.travel(id);engine.setActivityMoment(activityMoment(id));report('Recording '+id);
  for(let step=0;step<35;step++){
   if(id==='breathe')engine.setActivityMoment({kind:'breathe',active:true,amount:(Math.sin(step/35*Math.PI*2-Math.PI/2)+1)/2});
   if(id==='gratitude'&&step===22)engine.setActivityMoment({kind:'save'});
   if(id==='compliment'&&step===22)engine.setActivityMoment({kind:'keep'});
   await delay(100);
  }
 }
 recorder.stop();await save('activity-motion.webm',await recording);engine.setPlace(null);report('Saved activity animation recording.');
};
